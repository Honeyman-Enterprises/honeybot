# Local dev overlay — builds the image from the working tree instead of
# pulling from ghcr.io, and disables Watchtower (no auto-redeploys while
# you're actively editing).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Or set the default via:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    image: honeybot/hermes:local
    # The base compose sets pull_policy: always — override so local builds
    # aren't clobbered by a registry pull.
    pull_policy: never

  watchtower:
    # Disable auto-restart loop during local development.
    profiles: ["disabled"]
