# Production overlay — use on EC2.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The only thing this overlay changes is restart policy: `always` so the
# stack comes back after a host reboot, instead of `unless-stopped` which
# is the right default for a laptop.
#
# op.env lives at ./op.env (repo root) in BOTH dev and prod — gitignored
# via .gitignore, excluded from the image build via .dockerignore, and
# already visible to the redeploy sidecar through the `.:/repo` bind mount.
# There's no separate /etc/honeybot secret dir in the prod story — the
# file at the repo root is the single source of truth.
#
# Redeploy after a PR merges: handled automatically by the `redeploy`
# sidecar. Manual equivalent:
#   git pull && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  honeybot:
    restart: always

  redeploy:
    restart: always
