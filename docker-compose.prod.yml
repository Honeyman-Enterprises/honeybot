# Production overlay — use on EC2.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences vs base compose:
#   - hermes reads the service-account token from /etc/honeybot/op.env
#     (root-provisioned, chmod 600) instead of ./op.env in the repo dir.
#   - restart: always on hermes (survive host reboots).
#   - redeploy sidecar gets /etc/honeybot bind-mounted read-only so its
#     `docker compose up -d --build` can resolve hermes's env_file path
#     (env_file is resolved by the compose CLI, not the daemon — so the
#     path must exist inside the container running compose).
#
# Redeploy after a PR merges: handled automatically by the `redeploy`
# sidecar. Manual equivalent:
#   git pull && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  hermes:
    env_file:
      - /etc/honeybot/op.env
    restart: always

  redeploy:
    volumes:
      # Needed so compose inside the sidecar can read hermes's env_file
      # when rebuilding against the prod overlay. Read-only — the sidecar
      # has no business writing to the host's secrets directory.
      - /etc/honeybot:/etc/honeybot:ro
    restart: always
