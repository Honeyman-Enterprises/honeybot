# Honeybot — same compose file for local dev and EC2.
#
# Build model: straight from the Dockerfile in this repo. No registry.
# Auto-redeploy is handled by the `redeploy` sidecar defined below: it
# polls origin/main and runs `pull-and-restart.sh` against the host's
# docker daemon whenever a new commit lands.
#
# Manual redeploy (sidecar stopped or laptop dev):
#   git pull && docker compose up -d --build
#
# The ONLY plaintext secret on disk is OP_SERVICE_ACCOUNT_TOKEN, via
# env_file. Everything else is resolved from 1Password at container start.

# Project name is pinned so the `redeploy` sidecar's `docker compose`
# invocations target the same stack the host started. Without this the
# sidecar would default to its own WORKDIR name (`repo`) and spin up a
# duplicate set of containers.
name: honeybot

services:
  # ---------------------------------------------------------------------
  # secrets-init — one-shot. Seeds 1Password vault items + writes the
  # compose-level runtime env file that non-Varlock-aware containers
  # (elasticsearch, neo4j) consume. Runs BEFORE those services start.
  # ---------------------------------------------------------------------
  # Uses the same honeybot image, overriding the entrypoint to skip
  # hermes and just run seed-vault.sh + emit-runtime-env.sh to exit.
  # depends_on: condition: service_completed_successfully gates the
  # dependent services on this container exiting 0, so a vault failure
  # aborts the whole stack startup instead of cascading into confusing
  # errors downstream.
  #
  # Bind mount: `.:/repo` lets this service write /repo/.env.runtime to
  # the host filesystem. No other service mounts the repo — the file is
  # consumed by compose itself via env_file on ES and Neo4j.
  secrets-init:
    image: honeybot:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: honeybot-secrets-init
    # One-shot. `restart: no` so a successful exit doesn't loop. On
    # failure the dependent services refuse to start — that's the
    # intended fail-closed behavior.
    restart: "no"

    env_file:
      - ./op.env

    volumes:
      - .:/repo

    # Run as the host's ec2-user UID so emit-runtime-env.sh can write
    # /repo/.env.runtime. The honeybot image bakes a `honeybot` user at
    # UID 10001, but /repo is bind-mounted from the host directory owned
    # by ec2-user (1000:1000) — UID 10001 has no write permission there
    # and emit-runtime-env.sh fails with "Permission denied".
    #
    # See the redeploy service below for the canonical rationale and
    # the override env vars (HONEYBOT_HOST_UID / HONEYBOT_HOST_GID).
    user: "${HONEYBOT_HOST_UID:-1000}:${HONEYBOT_HOST_GID:-1000}"

    environment:
      # The baked-in /home/honeybot is owned by UID 10001 and not
      # writable by the UID we run as. Anything in this container that
      # touches $HOME (op CLI cache, aws CLI cache, etc.) must land
      # somewhere writable. /tmp is always world-writable and the
      # entrypoint chain doesn't depend on $HOME persistence.
      HOME: /tmp

    # Override the honeybot entrypoint. `cd /home/honeybot` because
    # seed-vault.sh expects to run from there (that's where .env.schema
    # and the op CLI state live). The dir is mode 0755 (default useradd)
    # so cd-in works for any UID; the COPY'd scripts are 0755 / 0644 so
    # readable too. emit-runtime-env.sh writes its output to the
    # bind-mounted /repo. ensure-aws-infra.sh runs last and no-ops on
    # machines where no honeybot-prod-tagged instance exists, so it's
    # safe to invoke unconditionally on laptops too.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        cd /home/honeybot
        ./seed-vault.sh
        ./emit-runtime-env.sh /repo/.env.runtime
        ./ensure-aws-infra.sh

    # No network attachment — it only talks to 1Password over the host's
    # default egress. Putting it on honeynet would invite accidental
    # coupling to other services.
    networks: []

    mem_limit: 256m
    memswap_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  honeybot:
    build:
      context: .
      dockerfile: Dockerfile
    image: honeybot:local
    container_name: honeybot
    restart: unless-stopped

    # Gate honeybot on secrets-init so the vault is guaranteed to be
    # seeded before the main container's own entrypoint tries to run
    # its (idempotent) seeder + varlock. Without this, a first-boot
    # race could leave varlock resolving against a half-populated vault.
    depends_on:
      secrets-init:
        condition: service_completed_successfully

    env_file:
      # ./op.env in the repo root — same path in dev and prod.
      # Gitignored (.gitignore) and excluded from the image build
      # (.dockerignore). The redeploy sidecar sees the same file via
      # the `.:/repo` bind mount, so its `docker compose up --build`
      # resolves this env_file without any extra wiring.
      #
      # Contains ONLY OP_SERVICE_ACCOUNT_TOKEN=ops_... (plus non-secret
      # overrides like HONEYBOT_SLACK_USER during local testing).
      - ./op.env

    environment:
      # Needed by the honeybot-dev skill to know which repo to clone/PR.
      HONEYBOT_REPO_SLUG: ${HONEYBOT_REPO_SLUG:-Honeyman-Enterprises/honeybot}
      HONEYBOT_DEV_BASE_BRANCH: ${HONEYBOT_DEV_BASE_BRANCH:-main}
      # Commit identity for bot-authored PRs (see skills/honeybot-dev/SKILL.md).
      HONEYBOT_COMMIT_NAME:  ${HONEYBOT_COMMIT_NAME:-Honeybot}
      HONEYBOT_COMMIT_EMAIL: ${HONEYBOT_COMMIT_EMAIL:-honeybot@noreply.honeymanenterprises.com}

    volumes:
      # Agent memory / FTS / skill state. Must persist across restarts.
      # (Mounted at .hermes/data because that's where the upstream hermes
      # runtime writes its state — the path is its convention, not ours.)
      - honeybot-data:/home/honeybot/.hermes/data
      # Self-edit workspace (clone of this repo). The honeybot-dev skill
      # lives here. Persists so a branch survives a container restart.
      - honeybot-workspace:/home/honeybot/workspace

    # No `ports:` — Slack Socket Mode is outbound-only. Nothing listens.

    # Resource ceiling for t4g.small (2 GB RAM). Honeybot idle is small;
    # leave headroom for skill subprocesses (npm install of HubSpot CLI, etc.).
    mem_limit: 1536m
    memswap_limit: 1536m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks: [honeynet]

  # ---------------------------------------------------------------------
  # Redeploy sidecar — polls origin/main, rebuilds honeybot when it moves.
  # ---------------------------------------------------------------------
  # Replaces what Watchtower would do in a registry-based world. See
  # redeploy/watch.sh for the loop logic and redeploy/Dockerfile for the
  # image contents (docker CLI + compose plugin + git + bash).
  #
  # Needs:
  #   - The host's docker socket (bind-mounted RO-ish; docker CLI needs rw)
  #     so it can issue `docker compose up -d --build` against the host.
  #   - The host repo bind-mounted at /repo so `git fetch` + `git reset`
  #     modify the same working tree the host's compose build context
  #     reads from.
  #
  # Security note: a container with /var/run/docker.sock has effective
  # root on the host. That's the standard Watchtower trade-off. The
  # attack surface is equivalent to "can merge a PR to main" because
  # this sidecar will happily rebuild anything main points at — gate
  # merges accordingly (branch protection, required reviews).
  redeploy:
    build:
      context: ./redeploy
      dockerfile: Dockerfile
    image: honeybot/redeploy:local
    container_name: honeybot-redeploy
    restart: unless-stopped

    # Run as ec2-user's UID/GID on the host so `git fetch` + `git reset
    # --hard` under /repo produce objects owned by ec2-user. Without this,
    # the sidecar runs as root (default in the docker:cli image) and
    # writes root-owned blobs into .git/objects, which blocks subsequent
    # ec2-user `git fetch` from the host shell with:
    #   "error: insufficient permission for adding an object to repository"
    #
    # HONEYBOT_HOST_UID / HONEYBOT_HOST_GID are shared with secrets-init
    # above — both services bind-mount /repo and need to write to the
    # host's working tree as the host's owning user. Renaming away from
    # the previous HONEYBOT_REDEPLOY_* names to reflect the repo-wide
    # alignment (not just the redeploy sidecar's concern).
    #
    # group_add attaches the host's docker group so the non-root UID can
    # still read/write /var/run/docker.sock and issue `docker compose`.
    # This is redeploy-specific — only this service touches the socket.
    #
    # Defaults match Amazon Linux 2023 (ec2-user=1000:1000, docker
    # group=988). Override via shell env when your host differs:
    #
    #   export HONEYBOT_HOST_UID=$(id -u ec2-user 2>/dev/null || id -u)
    #   export HONEYBOT_HOST_GID=$(id -g ec2-user 2>/dev/null || id -g)
    #   export HONEYBOT_DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
    #   docker compose up -d
    user: "${HONEYBOT_HOST_UID:-1000}:${HONEYBOT_HOST_GID:-1000}"
    group_add:
      - "${HONEYBOT_DOCKER_GID:-988}"

    environment:
      # Seconds between polls. 120s is cheap (1 git fetch/2min) and well
      # under GitHub's unauthenticated rate budget.
      HONEYBOT_POLL_INTERVAL: ${HONEYBOT_POLL_INTERVAL:-120}
      HONEYBOT_REPO_DIR: /repo
      HONEYBOT_DEV_BASE_BRANCH: ${HONEYBOT_DEV_BASE_BRANCH:-main}
      # Colon-separated compose files for pull-and-restart.sh to re-apply.
      # Must match whatever the host started with, or the sidecar will
      # diverge the running stack from the intended config on next poll.
      HONEYBOT_COMPOSE_FILES: ${HONEYBOT_COMPOSE_FILES:-docker-compose.yml:docker-compose.prod.yml}
      # Pin project name so `docker compose` inside the sidecar targets
      # the same project the host created (name: honeybot above).
      COMPOSE_PROJECT_NAME: honeybot
      # `git config --global` in watch.sh writes to $HOME/.gitconfig.
      # Default $HOME=/root isn't writable by the non-root UID we run as,
      # so point it at /tmp (always writable, ephemeral, fine because
      # watch.sh re-applies the safe.directory config on every container
      # start anyway).
      HOME: /tmp

    volumes:
      # Host repo → /repo. Read-write because pull-and-restart.sh does
      # `git fetch` and `git reset --hard`.
      - .:/repo
      # Host docker daemon. No alternative — the sidecar needs to issue
      # `docker compose up -d --build` against it.
      - /var/run/docker.sock:/var/run/docker.sock

    # Tiny footprint: just a polling loop + occasional docker/git invocations.
    mem_limit: 256m
    memswap_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    # No network attachment needed — it only talks to the local docker
    # socket and the internet (for `git fetch` and the compose plugin
    # during build). Default bridge is fine.

  # ---------------------------------------------------------------------
  # nginx — TLS termination + reverse proxy for public webhook traffic.
  # ---------------------------------------------------------------------
  # Listens on 80/443 on the host.
  #
  # Cert source: Let's Encrypt, issued + renewed in-process by
  # lua-resty-acme (HTTP-01 challenge). No certbot binary, no sidecar,
  # no cron. The base image is OpenResty (nginx + LuaJIT); the autossl
  # config lives in nginx/nginx.conf init_by_lua_block.
  #
  # Port 80 MUST be reachable from the public internet for HTTP-01
  # validation. The EIP + Route53 A records handle that. If SG rules
  # are tightened and block LE validators, issuance fails and nginx
  # keeps serving the last cached cert from acme-storage until expiry.
  #
  # Do NOT reintroduce certbot volumes, /etc/letsencrypt/* paths, or
  # AWS ACM cert-export logic here — ACM public certs can't be exported
  # and Private CA is ~$400/mo, so neither is viable for this topology.
  #
  # Routes:
  #   hooks.honeybot.honeymanenterprises.com/webhooks/* → honeybot:8644
  #   (Hermes webhook listener; enabled by Phase 2 config change.)
  #
  # nginx must be on honeynet to resolve upstream service names
  # (honeybot, mcp-*).
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: honeybot/nginx:local
    container_name: honeybot-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    environment:
      # Contact email on the ACME account. LE uses this only for
      # expiry / policy-change notifications — not a secret.
      ACME_ACCOUNT_EMAIL: ${ACME_ACCOUNT_EMAIL:-ops@honeymanenterprises.com}
      # Set to "1" to issue against LE staging (untrusted certs, much
      # higher rate limits). Useful for smoke-testing changes to the
      # autossl config without burning prod issuance quota. Unset / 0
      # for production.
      ACME_STAGING: ${ACME_STAGING:-0}

    volumes:
      # Persists issued certs + ACME account keys across container
      # restarts. A fresh volume forces re-issuance on first HTTPS
      # request per whitelisted domain — fine, LE prod limits are 50
      # certs/week/registered-domain which we're nowhere near.
      - acme-storage:/etc/openresty/acme-storage

    mem_limit: 128m
    memswap_limit: 128m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    networks: [honeynet]

  # ---------------------------------------------------------------------
  # elasticsearch — internal only. Backing store for image-ingest MCP.
  # ---------------------------------------------------------------------
  # Security is ENABLED (8.x default). Passwords resolved from 1Password
  # at start (op://Honeybot/Elasticsearch/*). Bound to honeynet only —
  # never exposed to the host or internet.
  #
  # Data persists on `elasticsearch-data`. Snapshots of the underlying
  # EBS volume are handled by an AWS DLM policy (see aws-infra/).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: honeybot-elasticsearch
    restart: unless-stopped

    # Wait for secrets-init to write .env.runtime before creating this
    # container — otherwise compose would error on a missing env_file.
    depends_on:
      secrets-init:
        condition: service_completed_successfully

    env_file:
      # .env.runtime is generated by the secrets-init service on every
      # `docker compose up`. Contains ELASTIC_PASSWORD and NEO4J_AUTH
      # read from 1Password via the service account token. Gitignored
      # and dockerignored; treated exactly like op.env.
      #
      # required: false because on a cold host the file doesn't exist
      # yet at compose-parse time — secrets-init writes it before ES
      # actually starts (depends_on gate above). Without this flag,
      # `docker compose config` fails on first run.
      - path: ./.env.runtime
        required: false

    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"  # internal network only
      # Heap. t4g.small has 2GB total; cap ES at 512MB to leave room.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      # ELASTIC_PASSWORD is sourced from .env.runtime above — do NOT
      # reintroduce a ${ELASTIC_PASSWORD:-} interpolation here. The
      # host shell never has the value; only 1Password does.

    # Never publish ports. Only accessible from containers on honeynet.
    # ports: []

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    ulimits:
      memlock: { soft: -1, hard: -1 }

    mem_limit: 768m
    memswap_limit: 768m

    healthcheck:
      # $$ defers expansion to the container's shell at runtime, where
      # ELASTIC_PASSWORD has been set via env_file (.env.runtime).
      # Using $ (single) would make compose substitute at parse time
      # from the host shell, which doesn't have the value.
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks: [honeynet]

  # ---------------------------------------------------------------------
  # neo4j — internal only. Graph store (schema supplied by user later).
  # ---------------------------------------------------------------------
  # v1: stands up an empty Neo4j 5 instance with auth. Do NOT populate
  # the graph model here — Eric supplies the Cypher directly. See
  # docs/neo4j.md (to be authored) once schema lands.
  neo4j:
    image: neo4j:5.24-community
    container_name: honeybot-neo4j
    restart: unless-stopped

    # Wait for secrets-init to write .env.runtime (see ES service for
    # the same pattern + rationale).
    depends_on:
      secrets-init:
        condition: service_completed_successfully

    env_file:
      # NEO4J_AUTH is sourced from .env.runtime, generated by
      # secrets-init. Format is "user/password" — neo4j's convention.
      # required: false tolerates a cold-host first run (see ES service).
      - path: ./.env.runtime
        required: false

    environment:
      # NEO4J_AUTH is provided via env_file above — do NOT reintroduce
      # a ${NEO4J_AUTH:-} interpolation here. Host shell never has it.
      #
      # Heap + pagecache tuned for t4g.small alongside ES.
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size:     "256m"
      NEO4J_server_memory_pagecache_size:     "128m"

    # Internal only. Bolt (7687) and HTTP (7474) never published.
    # ports: []

    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

    mem_limit: 768m
    memswap_limit: 768m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks: [honeynet]

volumes:
  honeybot-data:
  honeybot-workspace:
  elasticsearch-data:
  neo4j-data:
  neo4j-logs:
  # Issued TLS certs + ACME account keys for lua-resty-acme. Survives
  # container restarts; losing it forces LE re-issuance on next
  # handshake per whitelisted domain.
  acme-storage:

networks:
  honeynet:
    driver: bridge
