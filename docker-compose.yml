# Honeybot — same compose file for local dev and EC2.
#
# Build model: straight from the Dockerfile in this repo. No registry.
# Auto-redeploy is handled by the `redeploy` sidecar defined below: it
# polls origin/main and runs `pull-and-restart.sh` against the host's
# docker daemon whenever a new commit lands.
#
# Manual redeploy (sidecar stopped or laptop dev):
#   git pull && docker compose up -d --build
#
# The ONLY plaintext secret on disk is OP_SERVICE_ACCOUNT_TOKEN, via
# env_file. Everything else is resolved from 1Password at container start.

# Project name is pinned so the `redeploy` sidecar's `docker compose`
# invocations target the same stack the host started. Without this the
# sidecar would default to its own WORKDIR name (`repo`) and spin up a
# duplicate set of containers.
name: honeybot

services:
  # ---------------------------------------------------------------------
  # secrets-init — one-shot. Seeds 1Password vault items + writes the
  # compose-level runtime env file that non-Varlock-aware containers
  # (elasticsearch, neo4j) consume. Runs BEFORE those services start.
  # ---------------------------------------------------------------------
  # Uses the same honeybot image, overriding the entrypoint to skip
  # hermes and just run seed-vault.sh + emit-runtime-env.sh to exit.
  # depends_on: condition: service_completed_successfully gates the
  # dependent services on this container exiting 0, so a vault failure
  # aborts the whole stack startup instead of cascading into confusing
  # errors downstream.
  #
  # Bind mount: `.:/repo` lets this service write /repo/.env.runtime to
  # the host filesystem. No other service mounts the repo — the file is
  # consumed by compose itself via env_file on ES and Neo4j.
  secrets-init:
    image: honeybot:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: honeybot-secrets-init
    # One-shot. `restart: no` so a successful exit doesn't loop. On
    # failure the dependent services refuse to start — that's the
    # intended fail-closed behavior.
    restart: "no"

    env_file:
      - ./op.env

    volumes:
      - .:/repo

    # Start as root, drop privileges via gosu inside the entrypoint. This
    # is the canonical Postgres/MySQL/Redis pattern, and it's the only
    # shape that satisfies BOTH of op's safety checks simultaneously:
    #
    #   1. op CLI walks the ancestors of $HOME looking for non-current-
    #      UID-owned dirs and refuses to run if it finds any. mktemp under
    #      /tmp leaves /tmp itself (root:root, mode 1777) in the ancestor
    #      chain → rejected.
    #   2. op-daemon resolves its PID-file path via getpwuid(getuid()),
    #      NOT $HOME. With no /etc/passwd entry for the runtime UID it
    #      falls back to a stale `/home/<x>/op-daemon.pid` and ENOENTs.
    #
    # Compose's `user:` directive can't fix either — by entrypoint time
    # you're already the unprivileged UID, with no chown rights and no
    # /etc/passwd write rights. So we run as root, register the runtime
    # UID in /etc/passwd, pre-chown a clean /home/secrets-init, then
    # `exec gosu` to drop. Full rationale + impl in the script.
    #
    # HONEYBOT_HOST_UID / HONEYBOT_HOST_GID are read by the entrypoint
    # script (defaults 1000:1000 = Amazon Linux 2023 ec2-user) and used
    # for the privilege drop AND for chowning /home/secrets-init so op's
    # ownership walk passes. Override in the host shell when your EC2
    # isn't AL2023 — see the redeploy service below for the env vars.
    user: "0:0"

    entrypoint: ["/usr/local/bin/secrets-init-entrypoint.sh"]

    # No network attachment — it only talks to 1Password over the host's
    # default egress. Putting it on honeynet would invite accidental
    # coupling to other services.
    networks: []

    mem_limit: 256m
    memswap_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  honeybot:
    build:
      context: .
      dockerfile: Dockerfile
    image: honeybot:local
    container_name: honeybot
    restart: unless-stopped

    # Gate honeybot on secrets-init so the vault is guaranteed to be
    # seeded before the main container's own entrypoint tries to run
    # its (idempotent) seeder + varlock. Without this, a first-boot
    # race could leave varlock resolving against a half-populated vault.
    depends_on:
      secrets-init:
        condition: service_completed_successfully

    env_file:
      # ./op.env in the repo root — same path in dev and prod.
      # Gitignored (.gitignore) and excluded from the image build
      # (.dockerignore). The redeploy sidecar sees the same file via
      # the `.:/repo` bind mount, so its `docker compose up --build`
      # resolves this env_file without any extra wiring.
      #
      # Contains ONLY OP_SERVICE_ACCOUNT_TOKEN=ops_... (plus non-secret
      # overrides like HONEYBOT_SLACK_USER during local testing).
      - ./op.env

    environment:
      # Needed by the honeybot-dev skill to know which repo to clone/PR.
      HONEYBOT_REPO_SLUG: ${HONEYBOT_REPO_SLUG:-Honeyman-Enterprises/honeybot}
      HONEYBOT_DEV_BASE_BRANCH: ${HONEYBOT_DEV_BASE_BRANCH:-main}
      # Commit identity for bot-authored PRs (see skills/honeybot-dev/SKILL.md).
      HONEYBOT_COMMIT_NAME:  ${HONEYBOT_COMMIT_NAME:-Honeybot}
      HONEYBOT_COMMIT_EMAIL: ${HONEYBOT_COMMIT_EMAIL:-honeybot@noreply.honeymanenterprises.com}

    volumes:
      # Persistent Hermes state. sync-hermes-state.sh (called from the
      # entrypoint on every boot) symlinks state.db, config.yaml, auth.json,
      # skills/, cron/, sessions/, etc. into this volume. On first boot,
      # image-baked defaults are seeded into the volume; on subsequent boots,
      # the volume's content wins — so sessions, memory, auth tokens, RL
      # learning, cron jobs, and agent-created skills all survive container
      # rebuilds. Image-shipped skills/hooks are merged in on every boot
      # (new files added, existing user customizations preserved).
      - hermes-state:/home/honeybot/.hermes/state
      # Self-edit workspace (clone of this repo). The honeybot-dev skill
      # lives here. Persists so a branch survives a container restart.
      - honeybot-workspace:/home/honeybot/workspace
      # Generated files (images, exports) served by nginx at /files/.
      # Shared with the nginx container (read-only there) so the agent
      # can drop a file and it's immediately accessible at
      # https://honeybot.honeymanenterprises.com/files/<name>.
      - hermes-files:/home/honeybot/.hermes/files
      # OTP / trusted-session store (verified_sessions.json). Shared with
      # owui-auth-bridge so a Google login it verifies mints a session
      # honeybot's OTP gate can see. Also makes verification survive
      # rebuilds (previously ephemeral). Pre-created in the image so this
      # fresh volume inherits honeybot (10001) ownership.
      - honeybot-auth:/home/honeybot/.hermes/auth

    # No `ports:` — Slack Socket Mode is outbound-only. Nothing listens.

    # Resource ceiling for t4g.small (2 GB RAM). Honeybot idle is small;
    # leave headroom for skill subprocesses (npm install of HubSpot CLI, etc.).
    mem_limit: 1536m
    memswap_limit: 1536m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks: [honeynet]

  # ---------------------------------------------------------------------
  # Redeploy sidecar — polls origin/main, rebuilds honeybot when it moves.
  # ---------------------------------------------------------------------
  # Replaces what Watchtower would do in a registry-based world. See
  # redeploy/watch.sh for the loop logic and redeploy/Dockerfile for the
  # image contents (docker CLI + compose plugin + git + bash).
  #
  # Needs:
  #   - The host's docker socket (bind-mounted RO-ish; docker CLI needs rw)
  #     so it can issue `docker compose up -d --build` against the host.
  #   - The host repo bind-mounted at /repo so `git fetch` + `git reset`
  #     modify the same working tree the host's compose build context
  #     reads from.
  #
  # Security note: a container with /var/run/docker.sock has effective
  # root on the host. That's the standard Watchtower trade-off. The
  # attack surface is equivalent to "can merge a PR to main" because
  # this sidecar will happily rebuild anything main points at — gate
  # merges accordingly (branch protection, required reviews).
  redeploy:
    build:
      context: ./redeploy
      dockerfile: Dockerfile
    image: honeybot/redeploy:local
    container_name: honeybot-redeploy
    restart: unless-stopped

    # Run as ec2-user's UID/GID on the host so `git fetch` + `git reset
    # --hard` under /repo produce objects owned by ec2-user. Without this,
    # the sidecar runs as root (default in the docker:cli image) and
    # writes root-owned blobs into .git/objects, which blocks subsequent
    # ec2-user `git fetch` from the host shell with:
    #   "error: insufficient permission for adding an object to repository"
    #
    # HONEYBOT_HOST_UID / HONEYBOT_HOST_GID are shared with secrets-init
    # above — both services bind-mount /repo and need to write to the
    # host's working tree as the host's owning user. Renaming away from
    # the previous HONEYBOT_REDEPLOY_* names to reflect the repo-wide
    # alignment (not just the redeploy sidecar's concern).
    #
    # group_add attaches the host's docker group so the non-root UID can
    # still read/write /var/run/docker.sock and issue `docker compose`.
    # This is redeploy-specific — only this service touches the socket.
    #
    # Defaults match Amazon Linux 2023 (ec2-user=1000:1000, docker
    # group=988). Override via shell env when your host differs:
    #
    #   export HONEYBOT_HOST_UID=$(id -u ec2-user 2>/dev/null || id -u)
    #   export HONEYBOT_HOST_GID=$(id -g ec2-user 2>/dev/null || id -g)
    #   export HONEYBOT_DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
    #   docker compose up -d
    user: "${HONEYBOT_HOST_UID:-1000}:${HONEYBOT_HOST_GID:-1000}"
    group_add:
      - "${HONEYBOT_DOCKER_GID:-988}"

    # Wait for secrets-init to write .env.runtime so any future runtime
    # secrets are present on first boot. The sidecar itself has no required
    # secrets today (the deploy story is "watch git for changes" — no
    # webhook, no Slack token, just docker.sock + the bind-mounted repo)
    # but the dependency is kept so we don't accidentally race ES/Neo4j on
    # cold-start ordering.
    depends_on:
      secrets-init:
        condition: service_completed_successfully

    env_file:
      # .env.runtime is generated by the secrets-init service. Currently
      # provides ELASTIC_PASSWORD / NEO4J_AUTH consumed by their respective
      # services; the redeploy sidecar reads it for forward-compat only.
      # required: false — first cold-host run won't have the file at
      # compose-parse time; it's written before this container actually
      # starts due to depends_on above.
      - path: ./.env.runtime
        required: false

    environment:
      # Seconds between polls. 120s is cheap (1 git fetch/2min) and well
      # under GitHub's unauthenticated rate budget.
      HONEYBOT_POLL_INTERVAL: ${HONEYBOT_POLL_INTERVAL:-120}
      HONEYBOT_REPO_DIR: /repo
      HONEYBOT_DEV_BASE_BRANCH: ${HONEYBOT_DEV_BASE_BRANCH:-main}
      # Colon-separated compose files for pull-and-restart.sh to re-apply.
      # Must match whatever the host started with, or the sidecar will
      # diverge the running stack from the intended config on next poll.
      HONEYBOT_COMPOSE_FILES: ${HONEYBOT_COMPOSE_FILES:-docker-compose.yml:docker-compose.prod.yml}
      # Pin project name so `docker compose` inside the sidecar targets
      # the same project the host created (name: honeybot above).
      COMPOSE_PROJECT_NAME: honeybot
      # `git config --global` in watch.sh writes to $HOME/.gitconfig.
      # Default $HOME=/root isn't writable by the non-root UID we run as,
      # so point it at /tmp (always writable, ephemeral, fine because
      # watch.sh re-applies the safe.directory config on every container
      # start anyway).
      HOME: /tmp

    volumes:
      # Host repo → /repo. Read-write because pull-and-restart.sh does
      # `git fetch` and `git reset --hard`.
      - .:/repo
      # Host docker daemon. No alternative — the sidecar needs to issue
      # `docker compose up -d --build` against it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Deploy status output. pull-and-restart.sh writes
      # deploy-status.json here on every deploy attempt (deploying,
      # success, failed). nginx serves it at /files/deploy-status.json
      # and the honeybot container reads it for self-checks.
      - hermes-files:/srv/hermes-files

    # Tiny footprint: just a polling loop + occasional docker/git invocations.
    mem_limit: 256m
    memswap_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    # No network attachment needed — it only talks to the local docker
    # socket and the internet (for `git fetch` and the compose plugin
    # during build). Default bridge is fine.

  # ---------------------------------------------------------------------
  # nginx — TLS termination + reverse proxy for public webhook traffic.
  # ---------------------------------------------------------------------
  # Listens on 80/443 on the host.
  #
  # Cert source: Let's Encrypt, issued + renewed in-process by
  # lua-resty-acme (HTTP-01 challenge). No certbot binary, no sidecar,
  # no cron. The base image is OpenResty (nginx + LuaJIT); the autossl
  # config lives in nginx/nginx.conf init_by_lua_block.
  #
  # Port 80 MUST be reachable from the public internet for HTTP-01
  # validation. The EIP + Route53 A records handle that. If SG rules
  # are tightened and block LE validators, issuance fails and nginx
  # keeps serving the last cached cert from acme-storage until expiry.
  #
  # Do NOT reintroduce certbot volumes, /etc/letsencrypt/* paths, or
  # AWS ACM cert-export logic here — ACM public certs can't be exported
  # and Private CA is ~$400/mo, so neither is viable for this topology.
  #
  # Routes:
  #   hooks.honeybot.honeymanenterprises.com/webhooks/* → honeybot:8644
  #   ├─ /webhooks/bluebubbles  → Hermes BlueBubbles (iMessage) adapter
  #   └─ /webhooks/<future>     → reserved for Telegram (Phase 6) etc.
  #
  # nginx must be on honeynet to resolve upstream service names
  # (honeybot, mcp-*).
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: honeybot/nginx:local
    container_name: honeybot-nginx
    restart: unless-stopped

    ports:
      # 80→8080, 443→4433. The host (Mac) does WAN port-forwarding from
      # router :443 → Mac :4433 and :80 → Mac :8080, so the public-facing
      # URLs stay https://honeybot.honeymanenterprises.com (no :4433 in
      # the URL). The :8080 path exists only for lua-resty-acme HTTP-01
      # challenges + redirect-to-HTTPS, never for app traffic. Pick high
      # ports here (4433/8080) so the Mac itself is free to run other
      # things on 80/443 if it ever needs to.
      #
      # If you redeploy onto a host where you DO want nginx on 80/443
      # directly (e.g. an EC2 box that does nothing else), override this
      # block in a compose overlay rather than editing in place — that's
      # what docker-compose.prod.yml is for.
      - "8080:80"
      - "4433:443"

    environment:
      # Contact email on the ACME account. LE uses this only for
      # expiry / policy-change notifications — not a secret.
      ACME_ACCOUNT_EMAIL: ${ACME_ACCOUNT_EMAIL:-ops@honeymanenterprises.com}
      # Set to "1" to issue against LE staging (untrusted certs, much
      # higher rate limits). Useful for smoke-testing changes to the
      # autossl config without burning prod issuance quota. Unset / 0
      # for production.
      ACME_STAGING: ${ACME_STAGING:-0}

    volumes:
      # Persists issued certs + ACME account keys across container
      # restarts. A fresh volume forces re-issuance on first HTTPS
      # request per whitelisted domain — fine, LE prod limits are 50
      # certs/week/registered-domain which we're nowhere near.
      - acme-storage:/etc/openresty/acme-storage
      # Read-only mount of the hermes-files volume. The honeybot
      # container writes generated files (images, exports) here; nginx
      # serves them at /files/ with a location block in honeybot.conf.
      - hermes-files:/srv/hermes-files:ro

    mem_limit: 128m
    memswap_limit: 128m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    networks: [honeynet]

  # ---------------------------------------------------------------------
  # openwebui — chat frontend for the Hermes api_server adapter.
  # ---------------------------------------------------------------------
  # User-facing web app served at https://honeybot.honeymanenterprises.com/
  # (nginx terminates TLS and proxies / → openwebui:8080). Speaks the
  # OpenAI-compatible API to honeybot:8642 over honeynet.
  #
  # Open WebUI runs ITS OWN user-account database in /app/backend/data on
  # the openwebui-data volume. First signup becomes the local admin.
  # That's separate from the Slack allowlist — Slack auth gates the bot
  # via Socket Mode; this gates the web app via Open WebUI's own login.
  # Once the admin account exists, flip ENABLE_SIGNUP=false here and
  # re-up the container if you don't want strangers creating accounts.
  #
  # Why no `ports:` mapping — only nginx is the public surface. Putting
  # 3000 or 8080 on the host would bypass TLS and the autossl whitelist.
  #
  # Resources: Open WebUI is React + a Python/FastAPI backend. Idle is
  # ~150MB; under load with a few users open it's well under 1GB. Cap
  # at 1GB to leave headroom on the t4g.small / Mac sharing memory.
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: honeybot-openwebui
    restart: unless-stopped

    # Wait on secrets-init for varlock-resolved env, and on honeybot
    # itself so the api_server is reachable when Open WebUI's first
    # health probe fires.
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      honeybot:
        condition: service_started

    env_file:
      # Reads OPENWEBUI_SECRET_KEY + API_SERVER_KEY (Hermes bearer) from
      # .env.runtime, written by secrets-init via varlock at boot.
      - path: ./.env.runtime
        required: false

    environment:
      # ---- Hermes wiring -----------------------------------------------
      # Route through the owui-auth-bridge (NOT honeybot:8642 directly): it
      # round-trip-verifies the signed-in Google user and injects the
      # honeybot session key so their session skips the OTP gate. The bridge
      # forwards to honeybot:8642. See docs/openwebui-google-identity.md.
      OPENAI_API_BASE_URL: http://owui-auth-bridge:8080/v1

      # OPENAI_API_KEY — the bearer token Open WebUI presents to the
      # Hermes api_server — comes from .env.runtime (written by
      # emit-runtime-env.sh, which reads op://Honeybot/HermesAPI/key).
      # Do NOT set it here in `environment:` — that would override the
      # env_file injection with a Compose-parse-time ${} interpolation
      # that resolves against the host shell (where the var doesn't
      # exist), falling back to a useless literal string.

      # Suppress Open WebUI's auto-discovery of Ollama (we don't run it).
      # Without this, the dashboard renders an "Ollama unreachable" banner
      # on every page load.
      ENABLE_OLLAMA_API: "false"

      # ---- Auth / sessions --------------------------------------------
      # WEBUI_SECRET_KEY — signs Open WebUI's own session JWTs (NOT the
      # Hermes API key). Comes from .env.runtime → WEBUI_SECRET_KEY
      # (written by emit-runtime-env.sh from
      # op://Honeybot/OpenWebUI/secret_key). Same reasoning as
      # OPENAI_API_KEY above: do NOT set it here.

      # First signup becomes admin. After you've created your account,
      # flip to "false" and re-up the container to lock down the URL:
      #   ENABLE_SIGNUP: "false"
      # Leaving it true while Honeybot is single-user is fine; just be
      # aware the URL is public the moment DNS + nginx + cert resolve.
      ENABLE_SIGNUP: "true"

      # Google-only sign-in: hide the username/password form entirely so
      # the ONLY way in is "Continue with Google" (domain-restricted).
      # ⚠️ Ensure a Google login as your admin works BEFORE relying on
      # this — with the form hidden, a broken Google client locks everyone
      # out. Recovery is to flip this back to "true" and re-up.
      ENABLE_LOGIN_FORM: "false"

      # Forward the authenticated user's identity (email, name, id, role)
      # to the upstream model API (honeybot's api_server) as X-OpenWebUI-
      # User-* headers. This is the prerequisite for the Google-login →
      # skip-OTP synergy: it's how the Google-verified email reaches
      # honeybot. Safe no-op on its own — nothing breaks if unconsumed.
      # See docs/openwebui-google-identity.md.
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"

      # Default new accounts to "user" (not "admin"). Only the first
      # signup gets admin regardless of this setting.
      DEFAULT_USER_ROLE: "user"

      # ---- App URL / behind-proxy hints --------------------------------
      # Open WebUI uses WEBUI_URL for password-reset links, OAuth
      # callbacks, and websocket origin checks. Must match the public
      # URL nginx serves on, NOT the internal honeynet name.
      WEBUI_URL: "https://honeybot.honeymanenterprises.com"

      # Trust the X-Forwarded-* headers nginx sets so server-rendered
      # links use https:// and the right host instead of http://openwebui:8080.
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: ""

      # ---- Google OAuth ("Login with Google") --------------------------
      # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET come from .env.runtime
      # (emitted by secrets-init from op://Honeybot/OpenWebUI Google OAuth/).
      # Do NOT set them here — a Compose ${} override resolves against the
      # host shell at parse time and would shadow the env_file value (same
      # trap as the SMTP + API-key vars). The non-secret toggles are safe
      # here. Empty client id/secret => the Google button simply doesn't
      # appear; Open WebUI still boots. See docs/openwebui-google-oauth.md.
      ENABLE_OAUTH_SIGNUP: "true"
      # Merge a Google login into an existing account with the same email
      # (e.g. the password account you bootstrapped as admin). Safe because
      # OAUTH_ALLOWED_DOMAINS restricts to our verified Workspace domain —
      # Google-asserted emails there are trustworthy.
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      # Only @honeymanenterprises.com Google accounts may sign in. Belt-and-
      # suspenders with an Internal OAuth consent screen on the Google side.
      OAUTH_ALLOWED_DOMAINS: "honeymanenterprises.com"
      # Explicit callback (Open WebUI otherwise derives it from WEBUI_URL).
      # Must EXACTLY match the redirect URI registered on the Google client.
      GOOGLE_REDIRECT_URI: "https://honeybot.honeymanenterprises.com/oauth/google/callback"

      # ---- SMTP (outbound mail) ----------------------------------------
      # All SMTP_* values come from .env.runtime (emitted by secrets-init
      # from 1Password). Do NOT set them here in `environment:` — that
      # would override the env_file injection with empty Compose-parse-
      # time ${} interpolations. emit-runtime-env.sh writes the exact
      # env var names Open WebUI expects (SMTP_HOST, SMTP_PORT,
      # SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM_EMAIL, SMTP_FROM_NAME).
      #
      # SMTP_USE_TLS is hardcoded here because it's not a secret and
      # shouldn't vary — Workspace relay rejects plaintext, and we never
      # want to negotiate downward.
      SMTP_USE_TLS: "true"

      # Email verification on signup. Set true once SMTP is provisioned in
      # 1Password (op://Honeybot/SMTP/*) — see smtp-plan.md for the
      # Workspace Admin Console click-path. Until then, leave this false:
      # turning it on without working SMTP would lock new users out of
      # their own freshly-created accounts (signup succeeds, verification
      # email never arrives, account stays in "pending" state forever).
      #
      # Eric: flip this to "true" the moment your first successful
      # smtp-smoke.sh run goes through. This PR ships the wiring, NOT the
      # flip, on purpose.
      ENABLE_EMAIL_VERIFICATION: "false"

    volumes:
      # User accounts, chat history, RAG documents, etc. The "project
      # context and history on the left" panel writes here. Persists
      # across image bumps.
      - openwebui-data:/app/backend/data

    mem_limit: 1024m
    memswap_limit: 1024m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks: [honeynet]

  # ---------------------------------------------------------------------
  # voice-relay — voice assistants (Siri / Claude voice / ChatGPT voice)
  # → honeybot. Thin sidecar; see docs/voice-relay.md and voice-relay/.
  # ---------------------------------------------------------------------
  # Fronted by nginx at voice.honeybot.honeymanenterprises.com (no host
  # port — same posture as openwebui). Drives honeybot's api_server to run
  # the command, answers inline when fast, and DMs the requester in Slack
  # when the work outlasts the assistant's response window.
  #
  # Secrets (HONEYBOT_API_KEY = HermesAPI bearer, SLACK_BOT_TOKEN,
  # VOICE_TOKEN_MAP) arrive via .env.runtime, emitted by secrets-init from
  # 1Password. Non-secret tuning is set in `environment:` below. Do NOT
  # set the secret vars here — Compose ${} interpolation resolves against
  # the host shell at parse time and would shadow the env_file values
  # (the exact bug documented in scripts/emit-runtime-env.sh).
  voice-relay:
    build:
      context: ./voice-relay
    image: honeybot/voice-relay:local
    container_name: honeybot-voice-relay
    restart: unless-stopped

    depends_on:
      secrets-init:
        condition: service_completed_successfully
      honeybot:
        condition: service_started

    env_file:
      # HONEYBOT_API_KEY, SLACK_BOT_TOKEN, VOICE_TOKEN_MAP, VOICE_ADMIN_KEY.
      - path: ./.env.runtime
        required: false

    environment:
      VOICE_RELAY_PORT: "8080"
      # Keep under the assistant's own patience (~5s for Siri).
      VOICE_FAST_ACK_SECONDS: "3.5"
      VOICE_AGENT_TIMEOUT_SECONDS: "300"
      # api_server on the honeybot container (same endpoint openwebui uses).
      HONEYBOT_API_URL: "http://honeybot:8642/v1"
      HONEYBOT_MODEL: "honeybot"
      # Live token map pushed by honeybot's voice-token skill lands here.
      VOICE_TOKEN_STORE_PATH: "/data/tokens.json"
      # --- MCP OAuth (self-hosted AS, Google upstream) ---
      # Public issuer (must match the subdomain nginx serves + the Google
      # redirect URI's host). Client id/secret arrive via .env.runtime
      # (GoogleOAuth-VoiceRelay); empty there = OAuth dormant, MCP uses the
      # static voice-token bearer. See docs/voice-relay-oauth.md.
      VOICE_PUBLIC_URL: "https://voice.honeybot.honeymanenterprises.com"
      VOICE_OAUTH_ALLOWED_DOMAINS: "honeymanenterprises.com"
      VOICE_OAUTH_STORE_PATH: "/data/oauth.json"

    volumes:
      # Persists the live token map across relay restarts (the cold-start
      # seed still comes from VOICE_TOKEN_MAP in .env.runtime).
      - voice-relay-data:/data

    # Thin async proxy — a fraction of a core is plenty. Half a CPU and
    # 256m keep it out of Hermes' way.
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks: [honeynet]

  # ---------------------------------------------------------------------
  # owui-auth-bridge — Open WebUI → honeybot identity bridge.
  # ---------------------------------------------------------------------
  # Sits in front of honeybot's api_server for Open WebUI traffic ONLY.
  # Round-trip-verifies the signed-in Google user (Slack users.lookupByEmail,
  # + optional Open WebUI cross-check), mints a trusted OTP session in the
  # shared honeybot-auth volume, and injects X-Hermes-Session-Key so the
  # session skips the OTP gate. Fails closed: unverified → forwarded without
  # a session key (still works, just prompts OTP). Honeynet-only, no host
  # port. See docs/openwebui-google-identity.md.
  #
  # Runs as UID 10001 (== honeybot) so honeybot-auth is writable by both.
  owui-auth-bridge:
    build:
      context: .
      dockerfile: owui-auth-bridge/Dockerfile
    image: honeybot/owui-auth-bridge:local
    container_name: honeybot-owui-auth-bridge
    restart: unless-stopped

    depends_on:
      secrets-init:
        condition: service_completed_successfully
      honeybot:
        condition: service_started

    env_file:
      # API_SERVER_KEY (required bearer, = HermesAPI key) + SLACK_BOT_TOKEN.
      - path: ./.env.runtime
        required: false

    environment:
      BRIDGE_PORT: "8080"
      UPSTREAM_URL: "http://honeybot:8642"
      OAUTH_ALLOWED_DOMAINS: "honeymanenterprises.com"
      # otp_auth (reused inside the bridge) writes verified sessions here —
      # the shared volume honeybot reads from.
      HONEYBOT_AUTH_DIR: "/auth"
      # Optional authoritative Open WebUI cross-check. Leave unset unless
      # you've confirmed your OWUI version's GET /api/v1/users/{id} returns
      # `email`; when unset the Slack round-trip is the control.
      #   OWUI_API_URL: "http://openwebui:8080"
      #   OWUI_API_KEY: "<owui admin api key>"   # via .env.runtime, not here
      #   BRIDGE_REQUIRE_OWUI: "true"

    volumes:
      - honeybot-auth:/auth

    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks: [honeynet]

  # ---------------------------------------------------------------------
  # elasticsearch — internal only. Backing store for image-ingest MCP.
  # ---------------------------------------------------------------------
  # Security is ENABLED (8.x default). Passwords resolved from 1Password
  # at start (op://Honeybot/Elasticsearch/*). Bound to honeynet only —
  # never exposed to the host or internet.
  #
  # Data persists on `elasticsearch-data`. Snapshots of the underlying
  # EBS volume are handled by an AWS DLM policy (see aws-infra/).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: honeybot-elasticsearch
    restart: unless-stopped

    # On-demand only. ES backs the image-ingest MCP, which isn't needed
    # for normal operation, so it does NOT start with a plain
    # `docker compose up`. Start it explicitly when you need it:
    #   docker compose up -d elasticsearch          (targets it by name)
    #   docker compose --profile search up -d       (enables the profile)
    # Nothing depends_on ES, so gating it here is safe — honeybot,
    # openwebui, neo4j, and the voice-relay all come up without it.
    profiles: ["search"]

    # Wait for secrets-init to write .env.runtime before creating this
    # container — otherwise compose would error on a missing env_file.
    depends_on:
      secrets-init:
        condition: service_completed_successfully

    env_file:
      # .env.runtime is generated by the secrets-init service on every
      # `docker compose up`. Contains ELASTIC_PASSWORD and NEO4J_AUTH
      # read from 1Password via the service account token. Gitignored
      # and dockerignored; treated exactly like op.env.
      #
      # required: false because on a cold host the file doesn't exist
      # yet at compose-parse time — secrets-init writes it before ES
      # actually starts (depends_on gate above). Without this flag,
      # `docker compose config` fails on first run.
      - path: ./.env.runtime
        required: false

    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"  # internal network only
      # Heap. t4g.small has 2GB total; cap ES at 512MB to leave room.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      # ELASTIC_PASSWORD is sourced from .env.runtime above — do NOT
      # reintroduce a ${ELASTIC_PASSWORD:-} interpolation here. The
      # host shell never has the value; only 1Password does.

    # Never publish ports. Only accessible from containers on honeynet.
    # ports: []

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    ulimits:
      memlock: { soft: -1, hard: -1 }

    # Heap is pinned to 512m via ES_JAVA_OPTS above; the container needs
    # roughly heap + Lucene off-heap + JVM overhead, so 1g mem is a safe
    # ceiling. CPU capped so an ES indexing burst (it's the hungriest of
    # the auxiliaries) can't starve Hermes. It's on-demand anyway.
    cpus: 2.0
    mem_limit: 1g
    memswap_limit: 1g

    healthcheck:
      # $$ defers expansion to the container's shell at runtime, where
      # ELASTIC_PASSWORD has been set via env_file (.env.runtime).
      # Using $ (single) would make compose substitute at parse time
      # from the host shell, which doesn't have the value.
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks: [honeynet]

  # ---------------------------------------------------------------------
  # neo4j — internal only. Graph store (schema supplied by user later).
  # ---------------------------------------------------------------------
  # v1: stands up an empty Neo4j 5 instance with auth. Do NOT populate
  # the graph model here — Eric supplies the Cypher directly. See
  # docs/neo4j.md (to be authored) once schema lands.
  neo4j:
    image: neo4j:5.24-community
    container_name: honeybot-neo4j
    restart: unless-stopped

    # Wait for secrets-init to write .env.runtime (see ES service for
    # the same pattern + rationale).
    depends_on:
      secrets-init:
        condition: service_completed_successfully

    env_file:
      # NEO4J_AUTH is sourced from .env.runtime, generated by
      # secrets-init. Format is "user/password" — neo4j's convention.
      # required: false tolerates a cold-host first run (see ES service).
      - path: ./.env.runtime
        required: false

    environment:
      # NEO4J_AUTH is provided via env_file above — do NOT reintroduce
      # a ${NEO4J_AUTH:-} interpolation here. Host shell never has it.
      #
      # Heap + pagecache tuned for t4g.small alongside ES.
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size:     "256m"
      NEO4J_server_memory_pagecache_size:     "128m"

    # Internal only. Bolt (7687) and HTTP (7474) never published.
    # ports: []

    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

    # Small local graph: heap 256m + pagecache 128m (set above) + JVM
    # overhead (metaspace, direct buffers, thread stacks) fits comfortably
    # in 640m. 1 CPU is plenty for a tiny dataset and keeps cores free for
    # Hermes. Bump both only if the graph grows or queries get heavy.
    cpus: 1.0
    mem_limit: 640m
    memswap_limit: 640m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks: [honeynet]

volumes:
  # Hermes persistent state: state.db (sessions/FTS), config.yaml, auth.json,
  # skills/, hooks/, cron/, sessions/, kanban.db, response_store.db (RL), and
  # gateway routing files. sync-hermes-state.sh symlinks these from ~/.hermes/
  # into this volume on every boot. Replaces the old honeybot-data volume
  # (which was mounted at .hermes/data/ — a path Hermes never wrote to).
  hermes-state:
  honeybot-workspace:
  elasticsearch-data:
  neo4j-data:
  neo4j-logs:
  # Open WebUI's per-user data: accounts, chat history, RAG knowledge
  # bases, uploaded files. SQLite + filesystem under /app/backend/data.
  # Losing it logs every Open WebUI user out and wipes their chats —
  # but does NOT touch any Hermes data (sessions, memory, skills) which
  # live on honeybot-data above.
  # voice-relay live token map (pushed by honeybot's voice-token skill).
  # Small; survives relay restarts so freshly minted tokens aren't lost
  # between full compose-ups. 1Password remains the durable source of truth.
  voice-relay-data:
  # Shared OTP/trusted-session store between honeybot and owui-auth-bridge
  # (verified_sessions.json). The bridge mints here; honeybot's OTP gate
  # reads here. Also gives verified sessions durability across rebuilds.
  honeybot-auth:
  openwebui-data:
  # Issued TLS certs + ACME account keys for lua-resty-acme. Survives
  # container restarts; losing it forces LE re-issuance on next
  # handshake per whitelisted domain.
  acme-storage:
  # Generated files (images, exports) shared between honeybot and nginx.
  # honeybot writes to /home/honeybot/.hermes/files, nginx reads from
  # /srv/hermes-files (read-only) and serves at /files/. Persists across
  # container restarts so generated images survive rebuilds.
  hermes-files:

networks:
  honeynet:
    driver: bridge
