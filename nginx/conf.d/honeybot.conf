# Honeybot public-facing vhosts.
#
# TLS certs are issued + renewed in-process by lua-resty-acme (Let's
# Encrypt HTTP-01). The main autossl config lives in ../nginx.conf
# (init_by_lua_block). This file is just the per-vhost plumbing.
#
# ssl_certificate_by_lua_block replaces the bootstrap self-signed cert
# below with the real per-domain cert before each TLS handshake
# completes (for whitelisted SNI names). The bootstrap cert on disk
# exists only so nginx's config check passes at start — it must never
# be served to real clients for honeybot.honeymanenterprises.com or
# hooks.honeybot.*. Do NOT reintroduce certbot, /etc/letsencrypt/*
# paths, or AWS ACM cert-export logic here.
#
# Routing model:
#   honeybot.honeymanenterprises.com       → minimal landing + /healthz
#   hooks.honeybot.honeymanenterprises.com → Hermes webhook platform
#
# Upstream resolution: docker's embedded DNS (127.0.0.11) resolves
# container names on honeynet. Different from the http-level resolver
# in nginx.conf — that one is for lua-resty-acme's external calls.
resolver 127.0.0.11 valid=10s ipv6=off;

# ------------------------------------------------------------------------
# Port 80 — ACME challenge + /healthz + redirect to HTTPS.
# ------------------------------------------------------------------------
# lua-resty-acme's HTTP-01 challenge handler needs /.well-known/acme-
# challenge/ to be reachable on port 80 from Let's Encrypt's validators.
# The EIP + Route53 A records make the EC2 reachable at all whitelisted
# domain names. If port 80 egress from LE ever gets blocked (e.g.
# Security Group tightening), issuance will start failing — autossl
# logs the failure but nginx keeps serving the last cached cert until
# it expires.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        content_by_lua_block {
            require("resty.acme.autossl").serve_http_challenge()
        }
    }

    # Internal healthcheck. Not TLS because this path is only ever
    # reached from localhost / the docker bridge — the Dockerfile
    # HEALTHCHECK hits it over 127.0.0.1:80.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------
# Apex: honeybot.honeymanenterprises.com
# ------------------------------------------------------------------------
# Minimal landing page. No webhook traffic lands here.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name honeybot.honeymanenterprises.com;

    # Bootstrap fallback — replaced at handshake time by the block
    # below. nginx requires the files to exist at config load; this
    # pair is baked into the image by ../Dockerfile.
    ssl_certificate     /etc/nginx/ssl/bootstrap.crt;
    ssl_certificate_key /etc/nginx/ssl/bootstrap.key;
    ssl_certificate_by_lua_block {
        require("resty.acme.autossl").ssl_certificate()
    }

    include /etc/nginx/conf.d/_tls_params.inc;

    location = / {
        return 200 "honeybot\n";
        add_header Content-Type text/plain;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Catch-all — do not leak service detail.
    location / {
        return 404;
    }
}

# ------------------------------------------------------------------------
# hooks.honeybot.honeymanenterprises.com → Hermes webhook platform.
# ------------------------------------------------------------------------
# Hermes runs its webhook listener on port 8644 by default (set in its
# config). The `honeybot` service exposes it on the honeynet network.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hooks.honeybot.honeymanenterprises.com;

    ssl_certificate     /etc/nginx/ssl/bootstrap.crt;
    ssl_certificate_key /etc/nginx/ssl/bootstrap.key;
    ssl_certificate_by_lua_block {
        require("resty.acme.autossl").ssl_certificate()
    }

    include /etc/nginx/conf.d/_tls_params.inc;

    # Health probe.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Forward all /webhooks/* to the Hermes webhook listener on the
    # honeybot container. Using `set` + variable keeps nginx from
    # failing to start if the upstream isn't up yet (it re-resolves
    # on demand via the container-DNS resolver above).
    location /webhooks/ {
        set $upstream_honeybot http://honeybot:8644;
        proxy_pass         $upstream_honeybot;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Anything else on this subdomain is not a webhook path.
    location / {
        return 404;
    }
}
