# Honeybot public-facing vhosts.
#
# TLS certs are sourced from AWS ACM (not Let's Encrypt / certbot). The
# cert material for honeybot.honeymanenterprises.com (incl. *.honeybot.*
# SANs) is pulled into this container's filesystem at build/start time by
# the hook in ../Dockerfile / ../nginx.conf. Paths below point at
# /etc/nginx/ssl/... — the canonical location inside this image. If a
# cert is ever missing, nginx will fail to start — that's the intended
# fail-closed behavior. Do NOT reintroduce /etc/letsencrypt paths here.
#
# Routing model:
#   honeybot.honeymanenterprises.com       → Slack/gateway healthcheck (HTTPS-only landing)
#   hooks.honeybot.honeymanenterprises.com → Hermes webhook platform (/webhooks/*)
#   (future subdomains) → add a new server{} block per service
#
# Upstream resolution: docker's embedded DNS (127.0.0.11) resolves
# container names on the honeynet network. We set a resolver so nginx
# re-resolves if a container restarts with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# ------------------------------------------------------------------------
# Port 80 — healthcheck + redirect everything else to HTTPS.
# ------------------------------------------------------------------------
# No ACME challenge location: certs come from ACM, not Let's Encrypt.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Internal healthcheck path for the Dockerfile HEALTHCHECK and
    # load-balancer-style probes. Not TLS — this is only reachable from
    # localhost / the internal docker bridge.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------
# Apex: honeybot.honeymanenterprises.com
# ------------------------------------------------------------------------
# Minimal landing page / healthcheck. No webhook traffic lands here.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name honeybot.honeymanenterprises.com;

    # ACM-sourced cert material — see ../Dockerfile for how this gets
    # populated at container start.
    ssl_certificate     /etc/nginx/ssl/honeybot.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/honeybot.privkey.pem;

    include /etc/nginx/conf.d/_tls_params.inc;

    location = / {
        return 200 "honeybot\n";
        add_header Content-Type text/plain;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Catch-all — do not leak service detail.
    location / {
        return 404;
    }
}

# ------------------------------------------------------------------------
# hooks.honeybot.honeymanenterprises.com → Hermes webhook platform.
# ------------------------------------------------------------------------
# Hermes runs its webhook listener on port 8644 by default (set in its
# config). The `honeybot` service exposes it on the honeynet network.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hooks.honeybot.honeymanenterprises.com;

    # ACM-sourced cert material — see ../Dockerfile for how this gets
    # populated at container start.
    ssl_certificate     /etc/nginx/ssl/honeybot.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/honeybot.privkey.pem;

    include /etc/nginx/conf.d/_tls_params.inc;

    # Health probe.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Forward all /webhooks/* to the Hermes webhook listener on the
    # honeybot container. Using `set` + variable keeps nginx from failing
    # to start if the upstream isn't up yet (it re-resolves on demand).
    location /webhooks/ {
        set $upstream_honeybot http://honeybot:8644;
        proxy_pass         $upstream_honeybot;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Anything else on this subdomain is not a webhook path.
    location / {
        return 404;
    }
}
