# Honeybot public-facing vhosts.
#
# TLS certs are issued + renewed in-process by lua-resty-acme (Let's
# Encrypt HTTP-01). The main autossl config lives in ../nginx.conf
# (init_by_lua_block). This file is just the per-vhost plumbing.
#
# ssl_certificate_by_lua_block replaces the bootstrap self-signed cert
# below with the real per-domain cert before each TLS handshake
# completes (for whitelisted SNI names). The bootstrap cert on disk
# exists only so nginx's config check passes at start — it must never
# be served to real clients for honeybot.honeymanenterprises.com or
# hooks.honeybot.*. Do NOT reintroduce certbot, /etc/letsencrypt/*
# paths, or AWS ACM cert-export logic here.
#
# Routing model:
#   honeybot.honeymanenterprises.com       → minimal landing + /healthz
#   hooks.honeybot.honeymanenterprises.com → Hermes webhook platform
#
# Upstream resolution: docker's embedded DNS (127.0.0.11) resolves
# container names on honeynet. Declared at the `server` scope inside
# the hooks vhost below — NOT at http scope here — because nginx.conf
# already declares an http-level resolver (1.1.1.1 / 8.8.8.8) for
# lua-resty-acme's external calls to Let's Encrypt. Two `resolver`
# directives at the same scope is a config error ("resolver directive
# is duplicate"), which is what was crashing the master on boot
# until we hoisted the docker resolver into the server block that
# actually needs it for proxy_pass.

# ------------------------------------------------------------------------
# Port 80 — ACME challenge + /healthz + redirect to HTTPS.
# ------------------------------------------------------------------------
# lua-resty-acme's HTTP-01 challenge handler needs /.well-known/acme-
# challenge/ to be reachable on port 80 from Let's Encrypt's validators.
# The EIP + Route53 A records make the EC2 reachable at all whitelisted
# domain names. If port 80 egress from LE ever gets blocked (e.g.
# Security Group tightening), issuance will start failing — autossl
# logs the failure but nginx keeps serving the last cached cert until
# it expires.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        content_by_lua_block {
            require("resty.acme.autossl").serve_http_challenge()
        }
    }

    # Internal healthcheck. Not TLS because this path is only ever
    # reached from localhost / the docker bridge — the Dockerfile
    # HEALTHCHECK hits it over 127.0.0.1:80.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------
# Apex: honeybot.honeymanenterprises.com
# ------------------------------------------------------------------------
# Reverse-proxies / to the openwebui container. Open WebUI's frontend
# is served from /, its API is under /api/*, websockets at /ws/socket.io/*.
# Single proxy_pass handles all three because Open WebUI's backend
# routes them itself — we just need to forward.
#
# Resolver scope: declared at the server level (NOT http) for the same
# reason the hooks vhost does it — http-level is taken by lua-resty-acme's
# public resolver (1.1.1.1 / 8.8.8.8) and a second resolver at the same
# scope is a config error.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name honeybot.honeymanenterprises.com;

    # Docker's embedded DNS — re-resolves `openwebui` on demand so a
    # restart of that container doesn't permanently break this vhost.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Bootstrap fallback — replaced at handshake time by the block
    # below. nginx requires the files to exist at config load; this
    # pair is baked into the image by ../Dockerfile.
    ssl_certificate     /etc/nginx/ssl/bootstrap.crt;
    ssl_certificate_key /etc/nginx/ssl/bootstrap.key;
    ssl_certificate_by_lua_block {
        require("resty.acme.autossl").ssl_certificate()
    }

    include /etc/nginx/conf.d/_tls_params.inc;

    # Open WebUI uploads (RAG documents, voice memos, images attached to
    # chats) can run large. The http-level client_max_body_size is 10m
    # (set in nginx.conf for webhook payloads); raise it here without
    # affecting the hooks vhost. 100m is a reasonable cap — bigger than
    # any single LLM context window and small enough that abusive
    # uploads still get rejected.
    client_max_body_size 100m;

    # Health probe (kept for symmetry with the hooks vhost). Returns
    # locally without touching the upstream so it's also a useful
    # "is nginx alive" check independent of Open WebUI.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Generated files (images, exports) from the Hermes agent. Served
    # from the hermes-files shared volume mounted read-only at
    # /srv/hermes-files. The honeybot container writes files to
    # /home/honeybot/.hermes/files/<name> and they're immediately
    # accessible at https://honeybot.honeymanenterprises.com/files/<name>.
    #
    # Security: no directory listing (autoindex off), no dotfiles, and
    # the volume is mounted read-only so a compromised nginx can't write
    # back into the agent's file store.
    location /files/ {
        alias /srv/hermes-files/;
        autoindex off;

        # Block dotfiles (e.g. .gitkeep, .env) — defense in depth.
        location ~ /\. {
            return 404;
        }

        # Cache-friendly headers for generated images.
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
    }

    # Everything else → Open WebUI on honeynet.
    location / {
        set $upstream_openwebui http://openwebui:8080;
        proxy_pass         $upstream_openwebui;
        proxy_http_version 1.1;

        # Forward identifying headers. WEBUI_URL in compose is set to
        # the public https URL, but Open WebUI also reads X-Forwarded-*
        # to render server-side links (password reset emails, etc.) —
        # set them all so neither path generates a wrong-scheme URL.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  443;

        # WebSocket upgrade for Open WebUI's socket.io transport.
        # Without these, the chat UI falls back to long-polling which
        # is functional but adds latency to every streaming token.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Streaming chat completions can take minutes for long
        # responses. Raise read timeout well above the default 60s so
        # nginx doesn't 504 mid-stream. The api_server adapter sends
        # SSE keepalives every 30s on /v1/chat/completions, so an idle
        # stream stays alive even at 600s.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 30s;

        # Disable proxy buffering so SSE / streamed tokens reach the
        # browser as they arrive instead of after a flush boundary.
        proxy_buffering off;
        proxy_cache off;
    }
}

# ------------------------------------------------------------------------
# hooks.honeybot.honeymanenterprises.com → Hermes webhook platform.
# ------------------------------------------------------------------------
# Hermes runs its webhook listener on port 8644 by default (set in its
# config). The `honeybot` service exposes it on the honeynet network.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hooks.honeybot.honeymanenterprises.com;

    # Docker's embedded DNS — used by the proxy_pass below to re-resolve
    # the `honeybot` container name on demand. Scoped to this server so
    # it doesn't collide with the http-level public resolver in
    # nginx.conf (the one lua-resty-acme uses to reach Let's Encrypt).
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/nginx/ssl/bootstrap.crt;
    ssl_certificate_key /etc/nginx/ssl/bootstrap.key;
    ssl_certificate_by_lua_block {
        require("resty.acme.autossl").ssl_certificate()
    }

    include /etc/nginx/conf.d/_tls_params.inc;

    # Health probe.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Forward all /webhooks/* to the Hermes webhook listener on the
    # honeybot container. Using `set` + variable keeps nginx from
    # failing to start if the upstream isn't up yet (it re-resolves
    # on demand via the container-DNS resolver above).
    location /webhooks/ {
        set $upstream_honeybot http://honeybot:8644;
        proxy_pass         $upstream_honeybot;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Anything else on this subdomain is not a webhook path.
    location / {
        return 404;
    }
}
