# Main OpenResty config for Honeybot.
#
# TLS certs are issued and renewed in-process by lua-resty-acme
# (Let's Encrypt, HTTP-01 challenge). Configuration for autossl lives
# in init_by_lua_block below; per-vhost wiring lives in conf.d/.

# `user` is inherited from the base image (nobody). Declaring it again
# here would require the master to run as root, which the official
# openresty:*-alpine-fat image already handles — leave it alone.

worker_processes auto;

error_log  /dev/stderr  notice;
pid        /run/openresty.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Upload size ceiling. Retell + image ingest send JSON payloads; 10MB is
    # comfortable headroom without letting arbitrary clients flood us.
    client_max_body_size 10m;

    # -----------------------------------------------------------------
    # lua-resty-acme (autossl) — Let's Encrypt issuance + renewal.
    # -----------------------------------------------------------------
    # This block is deliberately kept as close to the upstream README
    # example as possible. We previously stacked half a dozen
    # customizations (env-driven email override, staging api_uri toggle,
    # custom renew_threshold, second `acme_locks` dict, full-path
    # storage_adapter string) on top of each other and ended up with a
    # silently-failing init that left AUTOSSL.config nil at request
    # time. Strip first, re-add deliberately if/when we actually need
    # each knob — and only one at a time, with `nginx -t` between.
    #
    # 16MB shmem is plenty for the cert metadata + per-domain locks
    # the autossl module manages internally. The 0.16.x line folded the
    # old separate `acme_locks` dict into the main `acme` dict, so
    # declaring `acme_locks` is a no-op at best and a footgun at worst.
    # Cert material itself lives on disk under
    # /etc/openresty/acme-storage (named volume, survives restarts).
    lua_shared_dict acme 16m;

    # Make sure opm-installed packages are findable. Without explicit
    # paths we rely on the base image's defaults, which have shifted
    # subtly between OpenResty point releases. Spell it out so a base
    # image bump can't silently break module resolution.
    lua_package_path  "/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/lualib/?.lua;;";
    lua_package_cpath "/usr/local/openresty/site/lualib/?.so;/usr/local/openresty/lualib/?.so;;";

    # Resolver used by lua-resty-acme to talk to Let's Encrypt.
    # Docker's embedded DNS (127.0.0.11) doesn't support external
    # lookups — we need public DNS. Cloudflare + Google, IPv4-only
    # since this host isn't guaranteed to have IPv6.
    resolver        1.1.1.1 8.8.8.8 ipv6=off;
    resolver_timeout 5s;

    # init_by_lua_block runs ONCE in master at startup. Workers fork()
    # from master and inherit the populated module table — that's how
    # AUTOSSL.config / AUTOSSL.client end up readable per-request.
    #
    # We wrap the call in pcall + ngx.log so init failures surface as a
    # loud line in the log instead of silently no-op'ing and leaving
    # workers with a half-initialized module. The previous symptom
    # ("config: nil at request time, no errors anywhere") was exactly
    # this: a quiet init failure with no diagnostic. If you see
    # `autossl.init FAILED:` in the nginx log, the rest of the message
    # is the actual root cause. If you see `autossl.init OK`, the
    # module is healthy and any later cert problems are downstream
    # (LE rate limit, HTTP-01 unreachable, etc).
    # Belt-and-suspenders diagnostic. We had an earlier round where
    # `ngx.log(ngx.NOTICE, ...)` from init_by_lua_block silently failed
    # to appear in `docker logs` despite the container being a fresh
    # master start, leaving us unable to tell whether init was firing
    # at all. So:
    #   1. ngx.ERR (not NOTICE) — guaranteed above any error_log
    #      threshold.
    #   2. Direct file write to /tmp/autossl-debug.log — bypasses the
    #      nginx logging pipeline entirely. If the log appears in
    #      `docker logs` we have working ngx.log; if only the file is
    #      populated, ngx.log from init context is broken in this
    #      OpenResty build and we know to log via files going forward;
    #      if neither shows up, init_by_lua_block isn't running at all
    #      and the bug is structural.
    # Diagnostic stays in until first successful LE issuance, then
    # gets stripped in a follow-up.
    init_by_lua_block {
        local function trace(msg)
            ngx.log(ngx.ERR, "AUTOSSL: ", msg)
            local f = io.open("/tmp/autossl-debug.log", "a")
            if f then
                f:write(os.date("!%Y-%m-%dT%H:%M:%SZ "), "init: ", msg, "\n")
                f:close()
            end
        end
        trace("init_by_lua entered")
        local ok, err = pcall(function()
            require("resty.acme.autossl").init({
                tos_accepted    = true,
                account_email   = "ops@honeymanenterprises.com",
                storage_adapter = "file",
                storage_config  = { dir = "/etc/openresty/acme-storage" },
                domain_whitelist = {
                    "honeybot.honeymanenterprises.com",
                    "hooks.honeybot.honeymanenterprises.com",
                },
            })
        end)
        if not ok then
            trace("autossl.init FAILED: " .. tostring(err))
        else
            trace("autossl.init OK")
        end
    }

    init_worker_by_lua_block {
        local function trace(msg)
            ngx.log(ngx.ERR, "AUTOSSL: ", msg)
            local f = io.open("/tmp/autossl-debug.log", "a")
            if f then
                f:write(os.date("!%Y-%m-%dT%H:%M:%SZ "), "worker: ", msg, "\n")
                f:close()
            end
        end
        trace("init_worker_by_lua entered")
        local ok, err = pcall(function()
            require("resty.acme.autossl").init_worker()
        end)
        if not ok then
            trace("autossl.init_worker FAILED: " .. tostring(err))
        else
            trace("autossl.init_worker OK")
        end
    }

    include /etc/nginx/conf.d/*.conf;
}
