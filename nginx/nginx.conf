# Main OpenResty config for Honeybot.
#
# TLS certs are issued and renewed in-process by lua-resty-acme
# (Let's Encrypt, HTTP-01 challenge). Configuration for autossl lives
# in init_by_lua_block below; per-vhost wiring lives in conf.d/.

# `user` is inherited from the base image (nobody). Declaring it again
# here would require the master to run as root, which the official
# openresty:*-alpine-fat image already handles — leave it alone.

worker_processes auto;

error_log  /dev/stderr  notice;
pid        /run/openresty.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Upload size ceiling. Retell + image ingest send JSON payloads; 10MB is
    # comfortable headroom without letting arbitrary clients flood us.
    client_max_body_size 10m;

    # -----------------------------------------------------------------
    # lua-resty-acme (autossl) shared state.
    # -----------------------------------------------------------------
    # 16MB is plenty — the dict holds per-domain cert metadata + an
    # in-process lock to serialize renewals across workers. Actual
    # cert material lives on disk under /etc/openresty/acme-storage
    # (named volume, survives restarts).
    lua_shared_dict acme           16m;
    lua_shared_dict acme_locks      1m;

    # Resolver used by lua-resty-acme to talk to Let's Encrypt.
    # Docker's embedded DNS (127.0.0.11) doesn't support external
    # lookups — we need public DNS. Cloudflare + Google, IPv4-only
    # since this host isn't guaranteed to have IPv6.
    resolver        1.1.1.1 8.8.8.8 ipv6=off;
    resolver_timeout 5s;

    init_by_lua_block {
        require("resty.acme.autossl").init({
            -- Agree to the LE subscriber agreement. Required.
            tos_accepted = true,

            -- Contact email for the ACME account. LE uses this only
            -- for expiration / policy-change notifications. Not a
            -- secret; overridable via compose env.
            account_email = os.getenv("ACME_ACCOUNT_EMAIL")
                or "ops@honeymanenterprises.com",

            -- Explicit whitelist — lua-resty-acme refuses to issue
            -- for any SNI name not listed here. This is the main
            -- safety rail: an attacker pointing attacker.com at our
            -- EIP can't trick us into issuing them a cert (they'd
            -- DoS LE on their behalf but nothing worse).
            domain_whitelist = {
                "honeybot.honeymanenterprises.com",
                "hooks.honeybot.honeymanenterprises.com",
            },

            -- Persist certs + account keys to disk, not just shmem.
            -- Survives container restarts; a fresh named volume
            -- triggers re-issuance on first request per domain.
            storage_adapter = "resty.acme.storage.file",
            storage_config  = { dir = "/etc/openresty/acme-storage" },

            -- Default threshold in lua-resty-acme is ~7 days. LE
            -- certs are 90 days; renewing at 30d leaves plenty of
            -- margin for a stuck worker or HTTP-01 transient.
            renew_threshold = 30 * 86400,

            -- Toggle staging endpoint via env. Staging has way higher
            -- rate limits but issues certs that browsers won't trust —
            -- use ACME_STAGING=1 for smoke tests, unset / 0 for prod.
            api_uri = (os.getenv("ACME_STAGING") == "1")
                and "https://acme-staging-v02.api.letsencrypt.org/directory"
                or  "https://acme-v02.api.letsencrypt.org/directory",
        })
    }

    init_worker_by_lua_block {
        require("resty.acme.autossl").init_worker()
    }

    include /etc/nginx/conf.d/*.conf;
}
