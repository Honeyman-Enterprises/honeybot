# Main nginx config for Honeybot.
# Per-site configs live in /etc/nginx/conf.d/*.conf.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # Security defaults applied per-server via conf.d
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Upload size ceiling. Retell + image ingest send JSON payloads; 10MB is
    # comfortable headroom without letting arbitrary clients flood us.
    client_max_body_size 10m;

    include /etc/nginx/conf.d/*.conf;
}
